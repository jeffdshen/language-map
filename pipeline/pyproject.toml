[project]
name = "langmap-pipeline"
version = "0.1.0"
description = "Offline, deterministic build pipeline for Language Map data packs"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy",
  "scipy",
  "jieba",
  "pypinyin",
  "opencc-python-reimplemented",
  "wordfreq",
  "pillow",
]

[dependency-groups]
dev = ["pytest", "ruff"]
# Speech clips (langmap audio; docs/audio.md). Not needed to build the pack or run tests.
audio = ["onnxruntime", "lameenc"]
audio-check = [{ include-group = "audio" }, "sherpa-onnx"]

[project.scripts]
langmap = "langmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langmap"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
